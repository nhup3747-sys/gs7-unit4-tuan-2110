<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS7 – Unit 4 – Luyện tập tuần 21/10</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2430;--sub:#5b6270;--line:#e1e4ec;--brand:#3d5af1;--good:#16794d;--good-bg:#e6f6ed;--bad:#b3262d;--bad-bg:#fdeaea;--gold:#f5a623}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:18px;padding:20px 14px 90px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.45rem;margin:0 0 4px}
.sub{color:var(--sub);font-size:.95rem;margin:0 0 14px}
.hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--brand);width:0;transition:width .25s}
.hudrow{display:flex;justify-content:space-between;font-size:.9rem;color:var(--sub);margin-top:5px;gap:8px;flex-wrap:wrap}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-size:.8rem;padding:3px 9px;border-radius:99px;background:#eceef5;color:#8a90a0;border:1px solid var(--line)}
.badge.on{background:#fff4d9;color:#7a5200;border-color:var(--gold);font-weight:700}
.info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:10px 14px;margin-bottom:16px}
.info label{display:flex;flex-direction:column;font-size:.85rem;color:var(--sub);gap:4px;flex:1 1 170px}
.info input{border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:1rem;font-family:inherit}
.info input.miss{border-color:var(--bad)}
section.lv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:18px}
section.lv h2{font-size:1.1rem;margin:0 0 2px}
.desc{color:var(--sub);font-size:.92rem;margin:0 0 10px}
.passage{background:#f1f4ff;border-left:4px solid var(--brand);padding:12px 14px;border-radius:8px;margin:8px 0 6px;font-size:1rem}
.q{border-top:1px solid var(--line);padding:14px 0}
.q:first-of-type{border-top:none}
.qt{margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:11px 14px;border-radius:10px;font-size:1rem;text-align:left;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--brand)}
.btn.sel{border-color:var(--brand);background:#eef1ff;font-weight:600}
.btn.ok{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:700}
.btn.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:700}
input.txt{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:1rem;font-family:inherit}
input.txt:focus{outline:none;border-color:var(--brand)}
.fb{display:none;margin-top:8px;padding:9px 12px;border-radius:8px;font-size:.92rem}
.fb.show{display:block}.fb.good{background:var(--good-bg);color:var(--good)}.fb.bad{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
button.p{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:13px 22px;font-size:1rem;font-weight:700;cursor:pointer}
button.p:disabled{opacity:.55;cursor:not-allowed}
button.s{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 22px;font-size:1rem;font-weight:700;cursor:pointer}
#err{color:var(--bad);font-weight:600;margin-top:8px;display:none}
#res{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;margin-top:18px}
#res.show{display:block}
.big{font-size:2.3rem;font-weight:800;color:var(--brand)}
.rank{font-size:1.2rem;font-weight:800;margin:6px 0}
#st{font-weight:600;font-size:.9rem;margin-top:8px}
#st.ok{color:var(--good)}#st.err{color:var(--bad)}
#prac{display:none;margin-top:18px}
#prac.show{display:block}
u{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
<h1>GS7 – Unit 4 – Luyện tập tuần 21/10</h1>
<p class="sub">Music and Arts · Âm nhạc và nghệ thuật · 35 câu · khoảng 25–30 phút. Mỗi câu đúng +10 XP, đúng 3 câu liền → Combo x2, BOSS +20 XP/câu.</p>
<div class="info">
<label>Trường (không bắt buộc)<input id="stuSchool" type="text" placeholder="Tên trường" autocomplete="off"></label>
<label>Lớp *<input id="stuClass" type="text" placeholder="VD: 7A1" autocomplete="off"></label>

</div>
<div class="hud">
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="hudrow"><span id="plabel">Đã trả lời: 0/35</span><span id="xplabel">XP: 0</span></div>
<div class="badges" id="badges"></div>
</div>
<div id="root"></div>
<div class="row"><button class="p" id="submitBtn">Nộp bài</button><button class="s" id="resetBtn">Làm lại từ đầu</button></div>
<div id="err"></div>
<div id="res">
<div>Điểm của em (thang 10)</div>
<div class="big" id="score10"></div>
<div id="cnt"></div>
<div class="rank" id="rank"></div>
<div id="xpres"></div>
<div id="st"></div>
<div class="row" style="justify-content:center"><button class="s" id="pracBtn">Luyện lại câu sai</button></div>
<p class="sub" id="pracNote" style="display:none">Phần luyện lại chỉ để ôn tập, không gửi lại điểm.</p>
</div>
<div id="prac"></div>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycby08od-VjK63bcLdiXGBgjz9imiBImjbBBKmjHqN1AnzfpBhEjFyItSniMfbPKm9TA/exec";
const CLASS_LABEL="GS7";
const TEST_NAME="Unit 4 - Music and Arts - Luyen tap tuan 2110";
const CFG={"unit": 4, "title": "Music and Arts", "sound": "/ʃ/ và /ʒ/", "passage": "The Hue Festival is a famous arts festival in Viet Nam. It takes place every two years. Visitors can watch traditional music, dance and water puppet shows. They can also visit art exhibitions and buy handmade gifts. Last year, thousands of people came from many countries. Many of them said the festival was as exciting as a big concert.", "levels": [{"key": "L1", "name": "LEVEL 1 – Khởi động", "desc": "Chọn nghĩa tiếng Việt đúng của từ.", "badge": "⭐ Từ vựng"}, {"key": "L2", "name": "LEVEL 2 – Phát âm", "desc": "Chọn đáp án đúng về phát âm và trọng âm.", "badge": "🔊 Phát âm"}, {"key": "L3", "name": "LEVEL 3 – Từ vựng & ngữ pháp", "desc": "Chọn đáp án đúng A, B, C hoặc D.", "badge": "🧠 Ngữ pháp"}, {"key": "L4", "name": "LEVEL 4 – Word form", "desc": "Viết dạng đúng của từ trong ngoặc.", "badge": "🔧 Word form"}, {"key": "L5", "name": "LEVEL 5 – Đồng nghĩa / Trái nghĩa", "desc": "Hai câu đầu: đồng nghĩa. Hai câu sau: trái nghĩa (từ gạch chân).", "badge": "🔁 Từ nghĩa"}, {"key": "L6", "name": "LEVEL 6 – Tìm lỗi sai", "desc": "Chọn phần (A, B, C hoặc D) có lỗi sai.", "badge": "🔍 Thám tử"}, {"key": "L7", "name": "LEVEL 7 – Viết lại câu", "desc": "Viết lại câu theo gợi ý, giữ nguyên nghĩa.", "badge": "✍️ Viết câu"}, {"key": "B", "name": "BOSS LEVEL – Đọc hiểu (+20 XP/câu)", "desc": "Đọc đoạn văn rồi trả lời.", "badge": "🏆 Boss"}], "qs": [{"t": "mc", "q": "<b>orchestra</b> nghĩa là gì?", "o": ["nhà soạn nhạc", "bài quốc ca", "dàn nhạc giao hưởng", "dàn hợp xướng"], "a": 2, "e": "orchestra = dàn nhạc giao hưởng.", "lv": 0, "xp": 10}, {"t": "mc", "q": "<b>sculpture</b> nghĩa là gì?", "o": ["phong cảnh", "điêu khắc, tác phẩm điêu khắc", "nhiếp ảnh", "bức tranh"], "a": 1, "e": "sculpture = điêu khắc.", "lv": 0, "xp": 10}, {"t": "mc", "q": "<b>puppet</b> nghĩa là gì?", "o": ["con rối", "nhân vật", "cọ vẽ", "diễn viên"], "a": 0, "e": "puppet = con rối.", "lv": 0, "xp": 10}, {"t": "mc", "q": "<b>museum</b> nghĩa là gì?", "o": ["nhà hát", "phòng triển lãm tranh", "bảo tàng", "lễ hội"], "a": 2, "e": "museum = bảo tàng.", "lv": 0, "xp": 10}, {"t": "mc", "q": "<b>concert hall</b> nghĩa là gì?", "o": ["thư viện", "bảo tàng", "phòng hòa nhạc", "phòng tập"], "a": 2, "e": "concert hall = phòng hòa nhạc.", "lv": 0, "xp": 10}, {"t": "mc", "q": "Chọn từ có phần gạch chân phát âm KHÁC:", "o": ["u<u>s</u>ual", "mu<u>si</u>cian", "<u>sh</u>ow", "exhibi<u>ti</u>on"], "a": 0, "e": "usual đọc /ʒ/; các từ còn lại đọc /ʃ/.", "lv": 1, "xp": 10}, {"t": "mc", "q": "Chọn từ có phần gạch chân phát âm KHÁC:", "o": ["mea<u>s</u>ure", "u<u>s</u>ually", "gara<u>g</u>e", "<u>sh</u>ow"], "a": 3, "e": "show đọc /ʃ/; các từ còn lại đọc /ʒ/.", "lv": 1, "xp": 10}, {"t": "mc", "q": "Chọn từ có trọng âm chính KHÁC:", "o": ["artist", "musician", "music", "puppet"], "a": 1, "e": "musician nhấn âm 2; các từ còn lại nhấn âm 1.", "lv": 1, "xp": 10}, {"t": "mc", "q": "Chọn từ có trọng âm chính KHÁC:", "o": ["camera", "portrait", "perform", "actress"], "a": 2, "e": "perform nhấn âm 2; các từ còn lại nhấn âm 1.", "lv": 1, "xp": 10}, {"t": "mc", "q": "Her painting looks ___ a real photo.", "o": ["as", "from", "than", "like"], "a": 3, "e": "look like + danh từ.", "lv": 2, "xp": 10}, {"t": "mc", "q": "This painting is not as big ___ that one.", "o": ["than", "from", "as", "like"], "a": 2, "e": "not as + adj + as.", "lv": 2, "xp": 10}, {"t": "mc", "q": "The two singers have the ___ voice. I can't tell the difference.", "o": ["different", "like", "same", "as"], "a": 2, "e": "the same = giống nhau.", "lv": 2, "xp": 10}, {"t": "mc", "q": "Our school choir is as ___ as the city choir.", "o": ["good", "better", "well", "best"], "a": 0, "e": "as + tính từ nguyên mẫu + as.", "lv": 2, "xp": 10}, {"t": "mc", "q": "Folk music is different ___ rock music.", "o": ["from", "than", "as", "with"], "a": 0, "e": "different from.", "lv": 2, "xp": 10}, {"t": "mc", "q": "Is this puppet show ___ interesting as that one?", "o": ["than", "as", "more", "like"], "a": 1, "e": "as + adj + as.", "lv": 2, "xp": 10}, {"t": "mc", "q": "A ___ is a picture of a person's face.", "o": ["landscape", "sculpture", "portrait", "puppet"], "a": 2, "e": "portrait = chân dung.", "lv": 2, "xp": 10}, {"t": "mc", "q": "Water puppetry ___ in the north of Viet Nam a long time ago.", "o": ["composes", "controls", "performs", "originated"], "a": 3, "e": "originate = bắt nguồn; a long time ago → quá khứ.", "lv": 2, "xp": 10}, {"t": "mc", "q": "We watched a water puppet ___ at the theatre.", "o": ["drama", "show", "beat", "anthem"], "a": 1, "e": "water puppet show = buổi biểu diễn múa rối nước.", "lv": 2, "xp": 10}, {"t": "mc", "q": "She is good at ___. She takes beautiful photos.", "o": ["drama", "sculpture", "photography", "folk art"], "a": 2, "e": "photography = nhiếp ảnh.", "lv": 2, "xp": 10}, {"t": "fill", "q": "Mai is a talented ___. She plays the piano very well. (music)", "a": ["musician"], "e": "music → musician (n).", "lv": 3, "xp": 10}, {"t": "fill", "q": "The ___ of the water puppet show was wonderful. (perform)", "a": ["performance"], "e": "perform → performance (n).", "lv": 3, "xp": 10}, {"t": "fill", "q": "She is a famous ___ in our country. (sing)", "a": ["singer"], "e": "sing → singer (n).", "lv": 3, "xp": 10}, {"t": "fill", "q": "Picasso was a great ___. (art)", "a": ["artist"], "e": "art → artist (n).", "lv": 3, "xp": 10}, {"t": "mc", "q": "He is a <u>creative</u> boy. (Đồng nghĩa)", "o": ["very tall", "afraid of art", "full of new ideas", "always late"], "a": 2, "e": "creative = sáng tạo ≈ full of new ideas.", "lv": 4, "xp": 10}, {"t": "mc", "q": "He <u>composed</u> a new song last year. (Đồng nghĩa)", "o": ["lost", "wrote", "sang", "bought"], "a": 1, "e": "compose = soạn nhạc ≈ write music.", "lv": 4, "xp": 10}, {"t": "mc", "q": "The song is <u>loud</u>. (Trái nghĩa)", "o": ["happy", "long", "quiet", "old"], "a": 2, "e": "loud ≠ quiet.", "lv": 4, "xp": 10}, {"t": "mc", "q": "The concert tickets were <u>cheap</u>. (Trái nghĩa)", "o": ["free", "short", "small", "expensive"], "a": 3, "e": "cheap ≠ expensive.", "lv": 4, "xp": 10}, {"t": "err", "q": "<b>(A) Lan's voice (B) is (C) as (D) beautifully as Mai's.</b>", "o": ["Lan's voice", "is", "as", "beautifully as Mai's"], "a": 3, "e": "as + tính từ + as: as beautiful as.", "lv": 5, "xp": 10}, {"t": "err", "q": "<b>(A) This song (B) sounds (C) as (D) a lullaby.</b>", "o": ["This song", "sounds", "as", "a lullaby"], "a": 2, "e": "sound like + danh từ.", "lv": 5, "xp": 10}, {"t": "err", "q": "<b>(A) The violin (B) is (C) not as (D) cheaper as the guitar.</b>", "o": ["The violin", "is", "not as", "cheaper as the guitar"], "a": 3, "e": "not as + tính từ nguyên mẫu + as: as cheap as.", "lv": 5, "xp": 10}, {"t": "rw", "q": "This ticket costs 50,000 dong. That ticket costs 50,000 dong. → <b>This ticket is as ...</b>", "a": ["This ticket is as expensive as that one", "This ticket is as expensive as that ticket"], "e": "as + adj + as.", "lv": 6, "xp": 10}, {"t": "rw", "q": "Mai's dress is not the same as Lan's dress. → <b>Mai's dress is different ...</b>", "a": ["Mai's dress is different from Lan's dress", "Mai's dress is different from Lan's"], "e": "different from.", "lv": 6, "xp": 10}, {"t": "rw", "q": "Nam's drawing is better than Hoa's. → <b>Hoa's drawing is not as ...</b>", "a": ["Hoa's drawing is not as good as Nam's", "Hoa's drawing is not as good as Nam's drawing"], "e": "not as + adj + as.", "lv": 6, "xp": 10}, {"t": "tf", "q": "The Hue Festival takes place every year.", "o": ["True", "False"], "a": 1, "e": "Lễ hội diễn ra hai năm một lần (every two years).", "lv": 7, "xp": 20}, {"t": "mc", "q": "What can visitors do at the festival?", "o": ["Learn to drive.", "Watch shows and visit art exhibitions.", "Play football.", "Only buy gifts."], "a": 1, "e": "Đoạn văn: watch traditional music, dance and water puppet shows; visit art exhibitions.", "lv": 7, "xp": 20}]};
const QS=CFG.qs, LV=CFG.levels;
const ans=Array(QS.length).fill(null);
let submitted=false, sent=false;
function norm(s){return (s||"").toString().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,;:"']/g,"").replace(/\s+/g," ").trim();}
function isRight(q,v){
  if(v===null||v==="")return false;
  if(q.t==="fill"||q.t==="rw"){const n=norm(v);return q.a.some(x=>norm(x)===n);}
  return v===q.a;
}
function rightText(q){return q.t==="fill"||q.t==="rw"?q.a[0]:(q.t==="err"?"("+"ABCD"[q.a]+") "+q.o[q.a].replace(/<[^>]+>/g,""):q.o[q.a].replace(/<[^>]+>/g,""));}
function qHtml(q,i,n){
  let h='<div class="q" id="q'+i+'"><div class="qt"><b>'+n+'.</b> '+q.q+'</div>';
  if(q.t==="fill"||q.t==="rw") h+='<input class="txt" type="text" data-i="'+i+'" autocomplete="off" autocapitalize="off" placeholder="'+(q.t==="rw"?"Viết cả câu ở đây…":"Viết đáp án…")+'">';
  else{h+='<div class="opts">';q.o.forEach((o,k)=>{h+='<button type="button" class="btn" data-i="'+i+'" data-k="'+k+'">'+(q.t==="err"?"ABCD"[k]+". ":(q.t==="tf"?"":"ABCD"[k]+". "))+o+'</button>';});h+='</div>';}
  return h+'<div class="fb" id="fb'+i+'"></div></div>';
}
const root=document.getElementById("root");
let num=0;
LV.forEach((L,li)=>{
  const sec=document.createElement("section");sec.className="lv";
  let h='<h2>'+L.name+'</h2><p class="desc">'+L.desc+(li===1?" Cặp âm: "+CFG.sound+".":"")+'</p>';
  if(L.key==="B")h+='<div class="passage">'+CFG.passage+'</div>';
  QS.forEach((q,i)=>{if(q.lv===li){num++;h+=qHtml(q,i,num);}});
  sec.innerHTML=h;root.appendChild(sec);
});
const bd=document.getElementById("badges");
LV.forEach(L=>{const s=document.createElement("span");s.className="badge";s.textContent=L.badge;s.id="b_"+L.key;bd.appendChild(s);});
function progress(){
  const a=ans.filter(v=>v!==null&&v!=="").length;
  document.getElementById("fill").style.width=(a/QS.length*100)+"%";
  document.getElementById("plabel").textContent="Đã trả lời: "+a+"/"+QS.length;
  LV.forEach((L,li)=>{const idx=QS.map((q,i)=>q.lv===li?i:-1).filter(i=>i>=0);
    document.getElementById("b_"+L.key).classList.toggle("on",idx.every(i=>ans[i]!==null&&ans[i]!==""));});
}
root.addEventListener("click",e=>{
  const b=e.target.closest(".btn");if(!b||submitted)return;
  const i=+b.dataset.i,k=+b.dataset.k;
  b.parentNode.querySelectorAll(".btn").forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel");ans[i]=k;progress();
});
root.addEventListener("input",e=>{
  const t=e.target;if(!t.classList.contains("txt")||submitted)return;
  ans[+t.dataset.i]=t.value.trim();progress();
});
function sendResult(p){
  const st=document.getElementById("st");
  st.className="";st.textContent="Đang gửi kết quả…";
  fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)})
  .then(()=>{st.className="ok";st.textContent="Đã gửi kết quả về hệ thống.";})
  .catch(er=>{st.className="err";st.textContent="Gửi thất bại (kiểm tra mạng): "+er.message;sent=false;});
}
document.getElementById("submitBtn").addEventListener("click",()=>{
  if(submitted)return;
  const nm=document.getElementById("stuName"),cl=document.getElementById("stuClass"),sc=document.getElementById("stuSchool");
  nm.classList.remove("miss");cl.classList.remove("miss");
  const er=document.getElementById("err");
  if(!nm.value.trim()||!cl.value.trim()){
    if(!nm.value.trim())nm.classList.add("miss");if(!cl.value.trim())cl.classList.add("miss");
    er.style.display="block";er.textContent="Em hãy điền Họ và tên và Lớp trước khi nộp bài nhé.";
    window.scrollTo({top:0,behavior:"smooth"});return;
  }
  er.style.display="none";submitted=true;
  let correct=0,xp=0,streak=0;
  QS.forEach((q,i)=>{
    const ok=isRight(q,ans[i]);const fb=document.getElementById("fb"+i);
    if(ok){correct++;const mult=streak>=3?2:1;xp+=q.xp*mult;streak++;fb.className="fb show good";fb.textContent="✓ Chính xác!"+(mult===2?" Combo x2!":"");}
    else{streak=0;fb.className="fb show bad";fb.innerHTML="✗ Đáp án đúng: <b>"+rightText(q)+"</b>. "+q.e;}
    const box=document.getElementById("q"+i);
    if(q.t==="fill"||q.t==="rw"){box.querySelector("input").disabled=true;}
    else box.querySelectorAll(".btn").forEach((b,k)=>{b.disabled=true;b.classList.remove("sel");if(k===q.a)b.classList.add("ok");else if(k===ans[i])b.classList.add("no");});
  });
  const total=QS.length,s10=(correct/total*10).toFixed(1),pct=correct/total*100;
  document.getElementById("score10").textContent=s10+"/10";
  document.getElementById("cnt").textContent="Đúng "+correct+"/"+total+" câu";
  document.getElementById("rank").textContent=pct>=90?"🌟 Siêu sao Unit "+CFG.unit:(pct>=70?"⚔️ Chiến binh":"💪 Cố lên – làm lại để lên hạng");
  document.getElementById("xpres").textContent="XP thưởng: "+xp;
  document.getElementById("xplabel").textContent="XP: "+xp;
  const r=document.getElementById("res");r.classList.add("show");
  document.getElementById("submitBtn").disabled=true;
  r.scrollIntoView({behavior:"smooth",block:"center"});
  if(!sent){sent=true;sendResult({className:CLASS_LABEL,testName:TEST_NAME,school:sc.value.trim(),studentClass:cl.value.trim(),name:nm.value.trim(),correct:correct,total:total,score10:s10,timestamp:new Date().toISOString()});}
});
document.getElementById("resetBtn").addEventListener("click",()=>location.reload());
/* Luyện lại câu sai (không gửi điểm) */
document.getElementById("pracBtn").addEventListener("click",()=>{
  const wrong=QS.map((q,i)=>isRight(q,ans[i])?-1:i).filter(i=>i>=0);
  const p=document.getElementById("prac");document.getElementById("pracNote").style.display="block";
  if(!wrong.length){p.innerHTML='<section class="lv"><h2>🎉 Em không sai câu nào!</h2></section>';p.className="show";return;}
  let h='<section class="lv"><h2>Luyện lại câu sai ('+wrong.length+' câu)</h2><p class="desc">Chỉ để luyện tập, điểm không được gửi lại.</p>';
  wrong.forEach((i,n)=>{const q=QS[i];
    h+='<div class="q" data-p="'+i+'"><div class="qt"><b>'+(n+1)+'.</b> '+q.q+'</div>';
    if(q.t==="fill"||q.t==="rw")h+='<input class="txt" type="text" autocomplete="off" autocapitalize="off"><div class="row"><button class="s chk" type="button">Kiểm tra</button></div>';
    else{h+='<div class="opts">';q.o.forEach((o,k)=>{h+='<button type="button" class="btn pb" data-k="'+k+'">'+(q.t==="tf"?"":"ABCD"[k]+". ")+o+'</button>';});h+='</div>';}
    h+='<div class="fb"></div></div>';});
  p.innerHTML=h+'</section>';p.className="show";p.scrollIntoView({behavior:"smooth"});
  p.addEventListener("click",e=>{
    const box=e.target.closest("[data-p]");if(!box)return;const q=QS[+box.dataset.p],fb=box.querySelector(".fb");
    const b=e.target.closest(".pb");
    if(b){const k=+b.dataset.k,ok=k===q.a;
      box.querySelectorAll(".pb").forEach((x,j)=>{x.classList.remove("ok","no");if(j===q.a)x.classList.add("ok");else if(j===k)x.classList.add("no");});
      fb.className="fb show "+(ok?"good":"bad");fb.innerHTML=ok?"✓ Đúng rồi!":"✗ Chưa đúng. Đáp án: <b>"+rightText(q)+"</b>. "+q.e;}
    if(e.target.classList.contains("chk")){const v=box.querySelector("input").value,ok=isRight(q,v);
      fb.className="fb show "+(ok?"good":"bad");fb.innerHTML=ok?"✓ Đúng rồi!":"✗ Chưa đúng. Đáp án: <b>"+rightText(q)+"</b>. "+q.e;}
  });
});
progress();
</script>
